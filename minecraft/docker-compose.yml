services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    pull_policy: daily
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      VERSION: "LATEST"
      MEMORY: "8G"
    volumes:
      # attach the relative directory 'data' to the container's /data path
      - /data/minecraft:/data